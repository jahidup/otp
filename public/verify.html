<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify OTP</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h2>Verify OTP</h2>
    <form id="verifyForm">
      <input type="email" id="email" placeholder="Email address" required>
      <input type="text" id="otp" placeholder="6-digit OTP" maxlength="6" required>
      <input type="password" id="password" placeholder="Create password (min 6 chars)" required>
      <button type="submit">Verify & Set Password</button>
    </form>
    <button id="resendBtn" style="margin-top: 10px;">Resend OTP</button>
    <div id="message" class="message"></div>
    <p><a href="register.html">Back to Register</a></p>
    <div id="loading" class="loading" style="display: none;">Processing...</div>
  </div>
  <script src="app.js"></script>
</body>
</html>
